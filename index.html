<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Login Form</title>
  <link rel="stylesheet" href="./css/login.css" />
  <script src="./js/login.js" defer></script>
  <script src="./js/forgor.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>

<body>
  <div id="sec-bg"></div>
  <div class="wrapper" style="--cornerbubul: 25px;">
    <div class="title">
      <img style="filter: brightness(100); padding-bottom: 1px; width: 126px;" src="img/logo.webp">
      <div>SPK Purchasing</div>
      <div style="font-size: 16px; font-weight: 200">Toko ATK DKiDS Media</div>
    </div>
    <form action="#">
      <div style="text-align: center; font-weight: 600; font-size: 22px;"> Login </div>
      <div style="text-align: center; font-size: 12px; color:#7e7676;">silahkan masukkan username dan password</div>
      <div class="row">
        <i class="fas fa-user"></i>
        <input id="username" type="text" placeholder="username" required />
      </div>
      <div class="row">
        <i class="fas fa-lock"></i>
        <input id="password" type="password" placeholder="password" required />
      </div>
      <div class="pass"><a href="#" onclick="forgor(); return false;">Lupa password?</a></div>
      <div class="row button">
        <input id="loginBtn" type="submit" value="Masuk" />
      </div>
      <!-- <div class="signup-link">Not a member? <a href="#">Signup now</a></div> -->
    </form>
  </div>

  <div style="position: absolute; bottom: 0; margin: auto; padding-bottom: 10px; font-size: 14px;">Jihan Arsyifa Putri | 2011010064</div>
</body>

</html>
